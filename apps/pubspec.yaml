name: savoryx
description: "Savoryx Personal Offline-First Financial OS."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State Management & DI
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Immutability & Annotations
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Typography, Localization & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  uuid: ^4.4.0

  # Offline-First Persistence
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^9.1.7
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  injectable_generator: ^2.6.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
