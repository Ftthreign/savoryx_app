services:
  postgres:
    image: postgres:16-alpine
    container_name: savoryx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-savoryx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-savoryx_secret}
      POSTGRES_DB: ${POSTGRES_DB:-savoryx_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-savoryx_user} -d ${POSTGRES_DB:-savoryx_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - savoryx_net

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: savoryx_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-savoryx_user}:${POSTGRES_PASSWORD:-savoryx_secret}@postgres:5432/${POSTGRES_DB:-savoryx_db}?sslmode=disable
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - savoryx_net

volumes:
  pgdata:
    driver: local

networks:
  savoryx_net:
    driver: bridge
