# Config file for [Air](https://github.com/air-verse/air) in TOML format

# Working directory
# . or absolute path, please note that the directories following must be under root.
root = "."
tmp_dir = "tmp"

[build]
# Just plain old shell command. You could use `make` as well.
cmd = "go build -o ./tmp/main.exe ./cmd/api"
# Binary file yields from `cmd`.
bin = "tmp\\main.exe"
# Customize binary, can setup environment variables when running your app.
full_bin = ""
# Watch these filename extensions.
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json", "env"]
# Ignore these filename extensions that will not trigger rebuild.
exclude_ext = ["exe", "log", "out"]
# Watch these directories if you specified.
include_dir = ["cmd", "internal", "db"]
# Watch these files.
include_file = []
# Exclude specific regular expressions.
exclude_regex = ["_test\\.go$"]
# Exclude unchanged files.
exclude_unchanged = true
# Follow symlink for directories
follow_symlink = true
# This log file places in your tmp_dir.
log = "air.log"
# Poll files for changes instead of using fsnotify. Useful for containerized/networked filesystems.
poll = false
# Poll interval (defaults to the minimum interval of 500ms).
poll_interval = 0 # ms
# It's not necessary to trigger build each time file changes if it's too frequent. Probably you want to add a delay between building.
delay = 500 # ms
# Stop the old binary before running the new one.
stop_on_error = true
# Send Interrupt signal before killing process (windows does not support this)
send_interrupt = false
# Delay after sending Interrupt signal
kill_delay = 500 # ms
# Add additional arguments when running your app.
args_bin = []

[log]
# Show log time
time = false
# Only show main log (silences watcher, build, runner)
main_only = false
# Silences all logs except error
silent = false

[color]
# Customize each part's color. If no color found, use the raw app log.
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# Delete tmp directory on exit
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
