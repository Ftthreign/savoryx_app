version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/adapter/repository/postgres/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "accounts.balance"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "exchange_rates.rate"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "user_preferences.monthly_income_net"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "transactions.amount"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "transactions.exchange_rate_to_base"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "transactions.base_amount"
            go_type: "github.com/shopspring/decimal.Decimal"
