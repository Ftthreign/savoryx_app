openapi: 3.0.3
info:
  title: Savoryx Financial OS Backend API
  version: 1.0.0
  description: |
    Personal Offline-First Financial OS REST API Engine.
    Provides device registration, multi-currency accounts, category hierarchy, and transactional ledger sync.
servers:
  - url: http://localhost:8080
    description: Local Development Server

tags:
  - name: Health
    description: Service availability, database pool readiness, and liveness probes
  - name: Authentication
    description: Device cryptographic handshakes and PASETO session token issuance
  - name: Accounts
    description: Multi-currency financial account management with strict decimal precision
  - name: Categories
    description: Transaction categorization and Needs vs Wants classification
  - name: Exchange Rates
    description: Daily foreign exchange snapshots and supported currencies (rate limited to 60 requests per minute per device)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PASETO
      description: |
        PASETO v4 local session token obtained from `/api/v1/auth/register-device`.
        Provide in the Authorization header as: `Bearer <token>`

  responses:
    TooManyRequests:
      description: Per-device rate limit exceeded (60 requests per minute, token bucket)
      headers:
        Retry-After:
          description: Seconds to wait before the next request will be accepted
          schema:
            type: integer
            minimum: 1
            example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: rate_limit_exceeded
              message: Too many requests, please retry later

  schemas:
    ResponseEnvelope:
      type: object
      properties:
        data:
          type: object
          description: Payload response data
        meta:
          type: object
          description: Optional pagination or metadata
      required:
        - data

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 4
          description: Total number of records matching the query
        limit:
          type: integer
          example: 50
          description: Maximum items returned in the collection
        offset:
          type: integer
          example: 0
          description: Offset of the initial record in the collection
      required:
        - total
        - limit
        - offset

    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
        - error

    ErrorBody:
      type: object
      properties:
        code:
          type: string
          example: ERR_VALIDATION_FAILED
        message:
          type: string
          example: Invalid input parameters provided
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required:
        - code
        - message

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: name
        message:
          type: string
          example: name is required
        code:
          type: string
          example: ERR_REQUIRED_FIELD

    RegisterDeviceRequest:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
          example: 01953bf6-2911-7000-8000-000000000001
          description: Client-generated UUIDv7 identifier
        device_name:
          type: string
          example: Chrome / Windows
          description: Human-readable device descriptor
        platform:
          type: string
          example: web
          description: Operating system or platform (android, ios, web, desktop)
        app_version:
          type: string
          example: 1.0.0
          description: Client application semver
      required:
        - device_id
        - device_name
        - platform
        - app_version

    RegisterDeviceResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
          example: 01953bf6-2911-7000-8000-000000000001
        token:
          type: string
          example: v4.local.example_paseto_v4_session_token_here
          description: PASETO v4 local encrypted session token
        device_secret:
          type: string
          example: a7f8d9b1c2e34567890abcdef1234567890abcdef1234567890abcdef1234567
          description: Hex-encoded client HMAC secret for signing mutation payloads
        expires_at:
          type: string
          format: date-time
          example: "2026-11-07T10:00:00Z"
      required:
        - device_id
        - token
        - device_secret
        - expires_at

    CreateAccountRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01953bf6-2911-7000-8000-000000000010
          description: Optional client-generated UUIDv7 identifier
        name:
          type: string
          example: Bank BCA Utama
          description: Account display name (1-64 characters)
        type:
          type: string
          enum: [CASH, BANK, E_WALLET, CREDIT_CARD, INVESTMENT, ASSET]
          example: BANK
          description: Account classification type
        currency:
          type: string
          example: IDR
          description: 3-letter ISO 4217 currency code
        balance:
          type: string
          example: "15000000.00"
          description: Initial balance formatted as decimal string
      required:
        - name
        - type

    UpdateAccountRequest:
      type: object
      properties:
        name:
          type: string
          example: Bank BCA Tabungan Bisnis
          description: Updated account display name (1-64 characters)
        type:
          type: string
          enum: [CASH, BANK, E_WALLET, CREDIT_CARD, INVESTMENT, ASSET]
          example: BANK
          description: Updated account classification type
      required:
        - name
        - type

    UpdateBalanceRequest:
      type: object
      properties:
        balance:
          type: string
          example: "17500000.50"
          description: Reconciled new balance decimal value
      required:
        - balance

    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01953bf6-2911-7000-8000-000000000010
        name:
          type: string
          example: Bank BCA Utama
        type:
          type: string
          example: BANK
        currency:
          type: string
          example: IDR
        balance:
          type: string
          example: "15000000.00"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - currency
        - balance
        - created_at
        - updated_at

    CreateCategoryRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01953bf6-2911-7000-8000-000000000020
          description: Optional client-generated UUIDv7 identifier
        name:
          type: string
          example: Makan & Minum
          description: Category display name (1-64 characters)
        icon:
          type: string
          example: utensils
          description: Category icon identifier or name
        color:
          type: string
          example: "#FF5733"
          description: Hex color code (#RGB or #RRGGBB)
        is_wants:
          type: boolean
          example: false
          description: Needs vs Wants classification (false = Needs, true = Wants)
      required:
        - name
        - icon
        - color

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          example: Makan & Kuliner
          description: Updated category display name (1-64 characters)
        icon:
          type: string
          example: utensils
          description: Updated category icon identifier or name
        color:
          type: string
          example: "#FF5733"
          description: Updated hex color code (#RGB or #RRGGBB)
        is_wants:
          type: boolean
          example: false
          description: Updated Needs vs Wants classification
      required:
        - name
        - icon
        - color

    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01953bf6-2911-7000-8000-000000000020
        name:
          type: string
          example: Makan & Minum
        icon:
          type: string
          example: utencils
        color:
          type: string
          example: "#FF5733"
        is_wants:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - icon
        - color
        - is_wants
        - created_at
        - updated_at

    ExchangeRateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01953bf6-2911-7000-8000-000000000030
        base_currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: USD
          description: 3-letter ISO 4217 base currency code
        target_currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: IDR
          description: 3-letter ISO 4217 target currency code
        rate:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          example: "16234.567891"
          description: |
            Units of target currency per one unit of base currency, serialized as a
            decimal string (NUMERIC(18,6) precision). Never a JSON number, so clients
            must parse it with a fixed-point or decimal type and never as a float.
        effective_date:
          type: string
          format: date
          example: "2026-11-02"
          description: UTC calendar date the snapshot is valid for
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - base_currency
        - target_currency
        - rate
        - effective_date
        - updated_at

    CurrencyResponse:
      type: object
      properties:
        code:
          type: string
          pattern: '^[A-Z]{3}$'
          example: IDR
        name:
          type: string
          example: Indonesian Rupiah
        symbol:
          type: string
          example: Rp
        decimal_places:
          type: integer
          example: 0
          description: Number of minor unit digits used by the currency
        is_active:
          type: boolean
          example: true
      required:
        - code
        - name
        - symbol
        - decimal_places
        - is_active

    RateListMeta:
      type: object
      properties:
        base:
          type: string
          example: USD
        total:
          type: integer
          example: 15
      required:
        - base
        - total

    CurrencyListMeta:
      type: object
      properties:
        total:
          type: integer
          example: 15
      required:
        - total

paths:
  /healthz:
    get:
      summary: Readiness probe
      description: Verifies that the HTTP service and PostgreSQL connection pool are healthy and ready to accept traffic.
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy and PostgreSQL connection is established
        '503':
          description: Service is degraded or database connection failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'

  /livez:
    get:
      summary: Liveness probe
      description: Lightweight probe to verify that the HTTP process is actively running.
      tags:
        - Health
      responses:
        '200':
          description: Process is alive

  /api/v1/ping:
    get:
      summary: Connectivity ping
      description: Returns a lightweight pong response with UTC server timestamp for latency checks.
      tags:
        - Health
      responses:
        '200':
          description: Pong response

  /api/v1/auth/register-device:
    post:
      summary: Register device handshake
      description: |
        Performs client-server handshake for initial device onboarding.
        Returns a signed PASETO v4 session token and unique device secret for HMAC signing.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device successfully registered
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/devices/01953bf6-2911-7000-8000-000000000001
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegisterDeviceResponse'
        '400':
          description: Invalid JSON body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Device ID already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/accounts:
    get:
      summary: List all active accounts
      description: Retrieves all active accounts for the authenticated device with dynamic pagination.
      tags:
        - Accounts
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of accounts to return (default 20, max 100)
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
            example: 20
        - name: offset
          in: query
          description: Number of initial records to skip (default 0)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
            example: 0
      responses:
        '200':
          description: List of active accounts with pagination metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountResponse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required:
                  - data
                  - meta
        '401':
          description: Unauthorized or expired PASETO token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    post:
      summary: Create new financial account
      description: Creates a new account with specified currency and initial balance.
      tags:
        - Accounts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created successfully
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/accounts/01953bf6-2911-7000-8000-000000000010
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Validation error or invalid monetary format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/accounts/{id}:
    get:
      summary: Get account by ID
      description: Retrieves account details by unique UUID.
      tags:
        - Accounts
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    put:
      summary: Update account metadata
      description: Updates account display name and account classification type.
      tags:
        - Accounts
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    delete:
      summary: Soft delete account
      description: Marks account as soft-deleted without purging historical ledger records.
      tags:
        - Accounts
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Account soft deleted successfully
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/accounts/{id}/balance:
    put:
      summary: Reconcile account balance
      description: Updates account balance with pessimistic row-locking to ensure monetary integrity.
      tags:
        - Accounts
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBalanceRequest'
      responses:
        '200':
          description: Balance updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid balance decimal format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    patch:
      summary: Reconcile account balance (Patch alias)
      description: Equivalent to PUT /api/v1/accounts/{id}/balance for partial mutation semantics.
      tags:
        - Accounts
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBalanceRequest'
      responses:
        '200':
          description: Balance updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AccountResponse'

  /api/v1/categories:
    get:
      summary: List all active categories
      description: Retrieves all active categories including Needs/Wants classifications with dynamic pagination.
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of categories to return (default 20, max 100)
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
            example: 20
        - name: offset
          in: query
          description: Number of initial records to skip (default 0)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
            example: 0
      responses:
        '200':
          description: List of active categories with pagination metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryResponse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required:
                  - data
                  - meta
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    post:
      summary: Create new custom category
      description: Creates a new transaction category with custom icon, hex color, and Wants classification.
      tags:
        - Categories
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created successfully
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/categories/01953bf6-2911-7000-8000-000000000020
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Validation error (e.g. invalid hex color or missing name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/categories/{id}:
    get:
      summary: Get category by ID
      description: Retrieves category details by unique UUID.
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CategoryResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    put:
      summary: Update category properties
      description: Updates category name, icon, hex color code, and wants classification.
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    delete:
      summary: Soft delete category
      description: Marks category as soft-deleted.
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Category soft deleted successfully
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/currencies:
    get:
      summary: List supported currencies
      description: Retrieves the master list of supported ISO 4217 currencies. Counts toward the per-device rate limit.
      tags:
        - Exchange Rates
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Supported currencies with total metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CurrencyResponse'
                  meta:
                    $ref: '#/components/schemas/CurrencyListMeta'
                required:
                  - data
                  - meta
        '401':
          description: Unauthorized or expired PASETO token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/rates/latest:
    get:
      summary: Get latest exchange rates
      description: |
        Returns the most recent exchange rate snapshot(s) for a base currency.

        - With `target`: responds with a single rate object.
        - Without `target`: responds with every available rate for `base`, plus list metadata.

        Rates are decimal strings; see the `ExchangeRateResponse.rate` schema.
      tags:
        - Exchange Rates
      security:
        - BearerAuth: []
      parameters:
        - name: base
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z]{3}$'
            default: USD
          description: 3-letter ISO 4217 base currency code (case-insensitive)
        - name: target
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z]{3}$'
          description: 3-letter ISO 4217 target currency code. Omit to list all targets.
      responses:
        '200':
          description: Single rate when `target` is supplied, otherwise a rate collection
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExchangeRateResponse'
                    required:
                      - data
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExchangeRateResponse'
                      meta:
                        $ref: '#/components/schemas/RateListMeta'
                    required:
                      - data
                      - meta
        '400':
          description: Invalid currency code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized or expired PASETO token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No exchange rate available for the requested pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/rates/historical:
    get:
      summary: Get historical exchange rate
      description: Returns the exchange rate snapshot for a base and target currency on a past UTC date.
      tags:
        - Exchange Rates
      security:
        - BearerAuth: []
      parameters:
        - name: base
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z]{3}$'
            default: USD
          description: 3-letter ISO 4217 base currency code (case-insensitive)
        - name: target
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z]{3}$'
          description: 3-letter ISO 4217 target currency code
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-10-30"
          description: Snapshot date in YYYY-MM-DD format. Future dates are rejected.
      responses:
        '200':
          description: Historical exchange rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExchangeRateResponse'
                required:
                  - data
        '400':
          description: Missing or invalid currency code or date parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized or expired PASETO token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No snapshot exists for the requested pair and date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
